# Representative manifest — every other Go service (identity, merchant, invoice,
# webhook, notification, settlement, reporting, wallet, fraud, reconciliation, billing)
# follows this exact shape: same image build path (services/cmd/<name>/Dockerfile),
# same envFrom secret, same port 8080 unless noted otherwise in that service's env vars.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels: { app: payment-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: sendago/payment-service:latest # built from services/cmd/payment-service/Dockerfile
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: sendago-env }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector: { app: payment-service }
  ports: [{ port: 8080, targetPort: 8080 }]
