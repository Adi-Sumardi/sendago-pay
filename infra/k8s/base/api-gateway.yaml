apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: { app: api-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: sendago/api-gateway:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: sendago-env }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app: api-gateway }
  type: LoadBalancer # placeholder; use an Ingress in a real deployment
  ports: [{ port: 80, targetPort: 8000 }]
