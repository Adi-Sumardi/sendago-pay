services:
  postgres:
    image: postgres:16-alpine
    container_name: sendago-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sendago}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sendagosecret}
      POSTGRES_DB: ${DB_NAME:-sendago_pay}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sendago} -d ${DB_NAME:-sendago_pay}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sendago-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sendago-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=8000
      - APP_ENV=production
      - DATABASE_URL=postgres://${DB_USER:-sendago}:${DB_PASSWORD:-sendagosecret}@postgres:5432/${DB_NAME:-sendago_pay}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-sendago-super-secret-jwt-key-2026}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
    container_name: sendago-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
